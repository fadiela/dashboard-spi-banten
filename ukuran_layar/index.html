<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
/* Komponen Streamlit mungil (tanpa build): melaporkan tinggi dan lebar jendela aplikasi ke Python,
   dan melapor lagi setiap jendela berubah ukuran (mis. masuk/keluar layar penuh). Hanya membaca ukuran; tidak menyimpan apa pun. */
(function () {
  function kirim(tipe, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipe }, data), "*"); }
  var terakhir = "", timer = null;
  function lapor() {
    var p = window.parent, h = Math.round(p.innerHeight / 20) * 20, w = Math.round(p.innerWidth / 20) * 20, kunci = h + "x" + w;
    if (kunci === terakhir || !h || !w) return;
    terakhir = kunci;
    kirim("streamlit:setComponentValue", { value: { h: h, w: w }, dataType: "json" });
  }
  window.addEventListener("message", function (e) { if (e.data && e.data.type === "streamlit:render") lapor(); });
  try { window.parent.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(lapor, 400); }); } catch (e) {}
  kirim("streamlit:componentReady", { apiVersion: 1 });
  kirim("streamlit:setFrameHeight", { height: 1 });
})();
</script>
</body></html>
